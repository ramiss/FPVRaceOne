; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs =
	targets/ESP32C6.ini

; The filesystem image is built from a GENERATED directory, not from data/.
; scripts/extra_script.py stages data/ into .pio/fsdata/ on every build, gzipping
; the web assets on the way through; see _stage_web_assets() for why compression
; happens at this layer rather than in committed files or in one image builder.
; data/ remains the plain, editable, git-tracked source — edit there, never here.
data_dir = .pio/fsdata
