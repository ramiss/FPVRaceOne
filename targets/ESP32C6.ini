[env:seeed_xiao_esp32c6]
; `pre:` so the web assets are staged into .pio/fsdata/ BEFORE the platform's
; filesystem builder resolves data_dir.  As a post-script the staging would run
; too late for `pio run -t buildfs` to see it.
extra_scripts = pre:scripts/extra_script.py
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
board_build.partitions = partitions_two_ota_XIAO_ESP32_C6.csv
board_upload.offset_address = 0x10000 ; Make sure the first flash goes into ota_0 (0x10000)
board_build.filesystem = littlefs
monitor_speed = 115200
board_build.f_cpu = 160000000L
lib_compat_mode = strict
lib_deps =
    https://github.com/ESP32Async/AsyncTCP.git#v3.4.9
    https://github.com/ESP32Async/ESPAsyncWebServer.git#v3.9.0
    bblanchon/ArduinoJson @7.2.0
lib_ignore =
  AsyncTCP@src-08944e2265d70e4bf415e06a141519af
build_flags =
    -D APP_BOARD_XIAO_C6
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
    -fexceptions
    ; NOTE: there was a -DCONFIG_ASYNC_TCP_EVENT_QUEUE_SIZE=256 here.  It was
    ; inert — no such macro exists in the AsyncTCP actually being linked
    ; (3.4.x, verified in firmware.map); the real name is
    ; CONFIG_ASYNC_TCP_QUEUE_SIZE and it defaults to 64.  Do NOT "fix" it by
    ; renaming: at 256 it would take effect and RAISE peak heap, since the
    ; queue is a list of individually malloc'd event packets and this value is
    ; the backpressure threshold. Leave the default alone.
    ; Reduce dead-connection detection time from 5 s to 3 s (AsyncTCP ACK timeout)
    -DCONFIG_ASYNC_TCP_MAX_ACK_TIME=3000
    ; Size optimization flags
    -Os                          ; Optimize for size instead of speed
    -ffunction-sections          ; Place functions in separate sections
    -fdata-sections              ; Place data in separate sections
    -Wl,--gc-sections           ; Remove unused sections at link time
    -DCORE_DEBUG_LEVEL=0        ; Disable Arduino core debug output
