<!-- viewBox cropped to the artwork's actual bounding box (was "0 0 2048 682").
     The original canvas carried ~30% empty space above the logo and ~32% below,
     so an <img> sized by height rendered mostly padding — which is what put the
     dead space in the page header.  No coordinate has been changed: this is
     purely a smaller window onto the same drawing, and width/height are updated
     to match so the intrinsic aspect ratio stays correct (7.6085:1).
     If this file is ever re-exported, crop it the same way or the header
     spacing will regress. -->
