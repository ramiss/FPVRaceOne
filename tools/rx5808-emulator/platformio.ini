; RX5808 analog emulator — bench test rig for FPVRaceOne timing measurement.
;
; Standalone project, deliberately NOT an env in the product platformio.ini:
; different board, different purpose, and it must never end up in a release
; build or in the merged.bin flashed to a real timer.
;
; Target is the original ESP32 (WROOM-32) specifically because it is the only
; ESP32 variant here with a built-in DAC.  The C6, C3 and S3 have none, and
; PWM + RC would add analog design and settling/ripple validation for no gain
; at the timescales being measured.

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

monitor_speed = 115200
; Raw serial: the harness speaks JSON lines, so keep the monitor filters off
; and let the PC side do the parsing.
monitor_filters = direct

lib_deps =
    bblanchon/ArduinoJson @7.2.0

build_flags =
    ; -O2 not -Os: this is a measurement instrument, and the envelope timer ISR
    ; should be as fast and as deterministic as possible.  Flash is irrelevant
    ; here — the sketch is tiny and the board has 4 MB.
    -O2
    -DCORE_DEBUG_LEVEL=0
